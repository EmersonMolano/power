name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: biblioteca
          POSTGRES_USER: biblioteca_user
          POSTGRES_PASSWORD: biblioteca_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca_user -d biblioteca"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create schema
        env:
          PGPASSWORD: biblioteca_pass
        run: psql -h 10.0.2.15 -U biblioteca_user -d biblioteca -f docker/postgres/init.sql
      - name: Build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.2.15:5432/biblioteca
          SPRING_DATASOURCE_USERNAME: biblioteca_user
          SPRING_DATASOURCE_PASSWORD: biblioteca_pass
        run: mvn -B package
      - name: Start backend
        env:
          SERVER_PORT: "8080"
          SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.2.15:5432/biblioteca
          SPRING_DATASOURCE_USERNAME: biblioteca_user
          SPRING_DATASOURCE_PASSWORD: biblioteca_pass
        run: |
          java -jar target/*.jar > backend.log 2>&1 &
          echo $! > backend.pid
      - name: Test API and Swagger
        run: |
          for i in {1..60}; do
            if curl -fsS http://10.0.2.15:8080/api/usuarios > /tmp/usuarios.json; then exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Test endpoints
        run: |
          curl -fsS http://10.0.2.15:8080/v3/api-docs > /tmp/openapi.json
          curl -fsS http://10.0.2.15:8080/api/libros > /tmp/libros.json
          curl -fsS http://10.0.2.15:8080/api/prestamos > /tmp/prestamos.json
