services:
  backend:
    build:
      context: .
    container_name: backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://10.0.2.15:25433/biblioteca
      SPRING_DATASOURCE_USERNAME: biblioteca_user
      SPRING_DATASOURCE_PASSWORD: biblioteca_pass
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
