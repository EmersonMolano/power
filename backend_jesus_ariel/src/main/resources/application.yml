server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: biblioteca-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://10.0.2.15:25433/biblioteca}
    username: ${SPRING_DATASOURCE_USERNAME:biblioteca_user}
    password: ${SPRING_DATASOURCE_PASSWORD:biblioteca_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: false

logging:
  level:
    org.hibernate.SQL: INFO
