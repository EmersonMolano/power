name: Frontend CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: docker build -t biblioteca-frontend-check .
      - name: Start frontend
        run: |
          npm start > frontend.log 2>&1 &
          echo $! > frontend.pid
      - name: Test frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://10.0.2.15:3000 > /tmp/frontend.html; then exit 0; fi
            sleep 2
          done
          cat frontend.log
          exit 1
